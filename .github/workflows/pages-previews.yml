name: Publish site and PR previews

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages-previews.yml'
      - '.github/scripts/build_pages.py'
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'docs/index.html'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # PR previews are for branches in this repository only.
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build production and open PR previews
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/build_pages.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
