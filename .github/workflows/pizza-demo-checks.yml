name: Check pizza demo

on:
  push:
    paths:
      - 'docs/index.html'
      - 'tests/pizza-demo.test.cjs'
      - 'package.json'
      - '.github/workflows/pizza-demo-checks.yml'
  pull_request:
    paths:
      - 'docs/index.html'
      - 'tests/pizza-demo.test.cjs'
      - 'package.json'
      - '.github/workflows/pizza-demo-checks.yml'

permissions:
  contents: read

jobs:
  test-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:demo
